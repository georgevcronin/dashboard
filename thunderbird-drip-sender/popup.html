<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drip Sender</title>
    <style>
      body {
        font: 13px/1.4 -apple-system, "Segoe UI", sans-serif;
        width: 300px;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 8px;
        margin: 0 0 12px;
      }
      dt {
        color: #555;
      }
      dd {
        margin: 0;
        font-weight: 600;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      button {
        flex: 1 1 auto;
        min-height: 32px;
        padding: 6px 8px;
        cursor: pointer;
      }
      #log {
        max-height: 140px;
        overflow-y: auto;
        border-top: 1px solid #ccc;
        padding-top: 6px;
        font-size: 11px;
        color: #444;
      }
      #log p {
        margin: 0 0 4px;
      }
      #status-line {
        font-size: 11px;
        color: #555;
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <h1>Drip Sender</h1>
    <p id="status-line"></p>
    <dl>
      <dt>Queued</dt>
      <dd id="queued-count">—</dd>
      <dt>Sent</dt>
      <dd id="sent-count">—</dd>
      <dt>Next send</dt>
      <dd id="next-send">—</dd>
    </dl>
    <div class="buttons">
      <button id="queue-btn">Queue Drafts Now</button>
      <button id="pause-btn">Pause</button>
      <button id="clear-btn">Clear Queue</button>
    </div>
    <div id="log"></div>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
