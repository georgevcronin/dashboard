<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Drip Sender Settings</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, "Segoe UI", sans-serif;
        max-width: 440px;
        margin: 24px auto;
        color: #1a1a1a;
      }
      h1 {
        font-size: 18px;
      }
      fieldset {
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 16px;
        padding: 12px 16px;
      }
      legend {
        font-weight: 600;
        padding: 0 4px;
      }
      .days {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .days label {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 44px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .row label {
        width: 140px;
      }
      input[type="time"],
      input[type="number"] {
        min-height: 32px;
        font-size: 14px;
      }
      button {
        min-height: 44px;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #saved-msg {
        color: #1a7a1a;
        margin-left: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Drip Sender Settings</h1>

    <fieldset>
      <legend>Days to send on</legend>
      <div class="days" id="days"></div>
    </fieldset>

    <fieldset>
      <legend>Time window</legend>
      <div class="row">
        <label for="start-time">Start time</label>
        <input type="time" id="start-time" />
      </div>
      <div class="row">
        <label for="end-time">End time</label>
        <input type="time" id="end-time" />
      </div>
      <div class="row">
        <label for="interval">Interval (minutes)</label>
        <input type="number" id="interval" min="1" max="1440" />
      </div>
    </fieldset>

    <button id="save-btn">Save</button>
    <span id="saved-msg" hidden>Saved.</span>

    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
