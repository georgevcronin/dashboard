<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Press">
<meta name="theme-color" content="#f5f0e2">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Press</title>
<style>html{background:#f5f0e2}html[data-theme="dark"]{background:#1b1812}body{margin:0;background:inherit}input,select,button{font-family:inherit}</style>
<script>try{if(localStorage.getItem('press_dark_mode')==='1')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<script>
// maximum-scale/user-scalable in the viewport meta tag above is ignored by
// modern iOS Safari (13+) for accessibility reasons — Apple deliberately
// stopped honoring it so sites can't block zoom. This blocks the pinch
// gesture directly instead, which iOS Safari does still respect.
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
<script>
// Lives outside app.js on purpose: this is the one net that still catches a
// user if the bundle itself never runs at all (network failure, broken
// deploy), not just an in-app crash — those are caught by app.jsx's
// ErrorBoundary instead, which shows its own fallback immediately rather
// than waiting for this timer. Registered before app.js loads so the error
// listeners are already attached if something throws during its own
// top-level execution.
window.__pressErrors = [];
window.addEventListener('error', function (e) { window.__pressErrors.push(e.message || String(e.error || e)); });
window.addEventListener('unhandledrejection', function (e) { window.__pressErrors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)); });
setTimeout(function () {
  var root = document.getElementById('root');
  // Empty root: app.js never rendered anything at all. A lingering
  // [data-press-loading] marker: it rendered LoadingScreen and then never
  // got past it (auth never resolved, or /summary never came back). Either
  // way, "root has real content and no marker" means it's fine — including
  // ErrorBoundary's own fallback, which already gave the user a way to
  // report, so this doesn't pile a second one on top.
  var stuck = !root || root.children.length === 0 || !!root.querySelector('[data-press-loading]');
  if (!stuck) return;
  var dark = document.documentElement.dataset.theme === 'dark';
  var paper = dark ? '#1b1812' : '#f5f0e2', ink = dark ? '#f0e9d8' : '#0d0b08';
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:Georgia,serif;background:' + paper + ';color:' + ink;
  box.innerHTML = '<div style="font-size:15px;max-width:320px;line-height:1.5">Press is taking longer than expected to load.</div>' +
    '<button id="press-report-btn" style="font-family:monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border:1px solid currentColor;background:none;color:inherit;cursor:pointer">Report This</button>' +
    '<div id="press-report-status" style="font-size:11px;opacity:.7;min-height:14px"></div>';
  document.body.appendChild(box);
  document.getElementById('press-report-btn').onclick = function () {
    var status = document.getElementById('press-report-status');
    status.textContent = 'Sending…';
    fetch('https://europe-west2-pressnewsletter.cloudfunctions.net/api/report', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'crash',
        error: window.__pressErrors.join('\n') || 'No error captured — the page just never finished loading.',
        url: location.href, userAgent: navigator.userAgent,
      }),
    }).then(function (r) { if (!r.ok) throw new Error(); status.textContent = 'Sent — thank you.'; })
      .catch(function () { status.textContent = 'Could not send automatically — please email pressnewsletterapp@gmail.com directly.'; });
  };
}, 5000);
</script>
</head>
<body><div id="root"></div><script src="/app.js"></script></body>
</html>
